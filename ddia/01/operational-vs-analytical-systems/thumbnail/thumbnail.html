<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>aynı data. farklı işler. — ddia #01</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../../../animations/fonts.css">
    <style>
      html, body { margin: 0; background: #0b0b0b; }
      .thumbnail {
        box-sizing: border-box;
        width: 100vw;
        height: 56.25vw;
        display: flex;
        align-items: center;
        padding: 5vw 8vw;
        color: #f5f5f5;
        font-family: 'IBM Plex Sans', sans-serif;
        font-weight: 400;
      }
      .composition { width: 100%; display: flex; flex-direction: column; gap: 4.2vw; }
      .chapter { position: relative; }
      .chapter-label {
        position: absolute;
        left: 0;
        bottom: calc(100% + 1.2vw);
        margin: 0;
        font-size: 3vw;
        line-height: 1.3;
        text-decoration: underline solid var(--chapter-accent);
        text-decoration-thickness: .24vw;
        text-underline-offset: 1vw;
        text-decoration-skip-ink: none;
      }
      .hero { margin: 0; font-size: 11.2vw; font-weight: 500; line-height: 1.07; letter-spacing: -.035em; }
      .accent { color: var(--chapter-accent); }
      .byline { margin: 0; font-size: 4vw; line-height: 1.3; }
    </style>
  </head>
  <body>
    <main class="thumbnail">
      <div class="composition">
        <div class="chapter">
          <p class="chapter-label">chapter 1</p>
          <h1 class="hero">aynı data.<br><span class="accent">farklı işler.</span></h1>
        </div>
        <p class="byline">operational vs. analytical systems</p>
      </div>
    </main>
    <script>
      // The renderer waits for the chapter color and the actual font faces.
      window.thumbnailReady = (async () => {
        const response = await fetch('../../theme.json');
        if (!response.ok) throw new Error(`Chapter theme: HTTP ${response.status}`);
        const {accent} = await response.json();
        if (typeof accent !== 'string' || !CSS.supports('color', accent)) {
          throw new Error('Chapter theme must define a valid accent color');
        }
        document.documentElement.style.setProperty('--chapter-accent', accent);
        const fonts = await Promise.all([400, 500].map(weight =>
          document.fonts.load(`${weight} 48px "IBM Plex Sans"`, 'aynı data. farklı işler.'),
        ));
        if (fonts.some(faces => faces.length === 0)) throw new Error('IBM Plex Sans could not be loaded');
        await document.fonts.ready;
      })();
    </script>
  </body>
</html>
