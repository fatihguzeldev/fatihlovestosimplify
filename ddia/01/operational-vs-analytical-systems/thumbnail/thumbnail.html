<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>aynı data. farklı işler. — ddia #01</title>
    <link rel="icon" href="data:,">
    <style>
      html, body { margin: 0; background: var(--background); }
      .thumbnail {
        box-sizing: border-box;
        width: 100vw;
        height: 56.25vw;
        display: flex;
        align-items: center;
        padding: var(--thumbnail-padding-y) var(--thumbnail-padding-x);
        color: var(--foreground);
        font-family: var(--font-sans), sans-serif;
        font-weight: 400;
      }
      .composition { width: 100%; display: flex; flex-direction: column; gap: var(--thumbnail-topic-gap); }
      .chapter { position: relative; }
      .chapter-label {
        position: absolute;
        left: 0;
        bottom: calc(100% + var(--thumbnail-chapter-gap));
        margin: 0;
        font-size: var(--thumbnail-chapter-size);
        line-height: var(--thumbnail-label-line-height);
        text-decoration: underline solid var(--chapter-accent);
        text-decoration-thickness: var(--thumbnail-underline-thickness);
        text-underline-offset: var(--thumbnail-underline-offset);
        text-decoration-skip-ink: none;
      }
      .hero { margin: 0; font-size: var(--thumbnail-title-size); font-weight: 500; line-height: var(--thumbnail-title-line-height); letter-spacing: var(--thumbnail-title-letter-spacing); }
      .accent { color: var(--chapter-accent); }
      .byline { margin: 0; font-size: var(--thumbnail-topic-size); line-height: var(--thumbnail-label-line-height); }
    </style>
  </head>
  <body>
    <main class="thumbnail">
      <div class="composition">
        <div class="chapter">
          <p class="chapter-label">chapter 1</p>
          <h1 class="hero">aynı data.<br><span class="accent">farklı işler.</span></h1>
        </div>
        <p class="byline">operational vs. analytical systems</p>
      </div>
    </main>
    <script>
      // HTML and Motion Canvas consume the same common → chapter → video theme.
      window.thumbnailReady = (async () => {
        const [{theme}, {loadFonts}] = await Promise.all([
          import('../theme.ts'),
          import('../../../../common/fonts.ts'),
        ]);
        const {thumbnail} = theme;
        const properties = {
          '--background': theme.colors.background,
          '--foreground': theme.colors.foreground,
          '--chapter-accent': theme.colors.accent,
          '--font-sans': `"${theme.fontFamily.sans}"`,
          '--thumbnail-padding-x': `${thumbnail.paddingX}vw`,
          '--thumbnail-padding-y': `${thumbnail.paddingY}vw`,
          '--thumbnail-chapter-gap': `${thumbnail.chapterGap}vw`,
          '--thumbnail-topic-gap': `${thumbnail.topicGap}vw`,
          '--thumbnail-chapter-size': `${thumbnail.chapterFontSize}vw`,
          '--thumbnail-title-size': `${thumbnail.titleFontSize}vw`,
          '--thumbnail-topic-size': `${thumbnail.topicFontSize}vw`,
          '--thumbnail-title-line-height': String(thumbnail.titleLineHeight),
          '--thumbnail-label-line-height': String(thumbnail.labelLineHeight),
          '--thumbnail-title-letter-spacing': `${thumbnail.titleLetterSpacing}em`,
          '--thumbnail-underline-thickness': `${thumbnail.underlineThickness}vw`,
          '--thumbnail-underline-offset': `${thumbnail.underlineOffset}vw`,
        };
        for (const [property, value] of Object.entries(properties)) {
          document.documentElement.style.setProperty(property, value);
        }
        await loadFonts();
      })();
    </script>
  </body>
</html>
