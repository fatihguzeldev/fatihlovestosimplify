<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Measure render duration</title>
  </head>
  <body>
    <script type="module">
      import { Player } from '@motion-canvas/core';
      import { renderFormat } from './video-format.mjs';

      try {
        const file = new URLSearchParams(location.search).get('project');
        if (!file) throw new Error('Missing project.');
        const { default: project } = await import(
          /* @vite-ignore */ `/${file.split('/').map(encodeURIComponent).join('/')}?project`
        );
        const settings = project.meta.getFullRenderingSettings();
        const format = renderFormat({
          width: settings.size.x,
          height: settings.size.y,
          fps: settings.fps,
          resolutionScale: settings.resolutionScale,
        });
        const player = new Player(project, settings);
        const total = await new Promise((resolve, reject) => {
          const timeout = setTimeout(() => reject(new Error('Duration probe timed out.')), 60_000);
          player.onDurationChanged.subscribe((duration) => {
            if (duration > 0) {
              clearTimeout(timeout);
              resolve(duration + 1);
            }
          });
        });
        player.deactivate();
        window.renderInfo = {
          total,
          format,
          audio: project.audio ? new URL(project.audio, location.href).href : null,
          audioOffset: settings.audioOffset,
        };
      } catch (error) {
        window.renderInfo = { error: String(error) };
      }
    </script>
  </body>
</html>
